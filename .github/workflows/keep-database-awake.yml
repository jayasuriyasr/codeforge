# Supabase pauses free projects after 7 days without activity. One tiny read
# every 3 days keeps the live site's database awake.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL              https://<project>.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  the project's publishable key (public; the site uses it too)
name: Keep database awake

on:
  schedule:
    - cron: '17 3 */3 * *'   # 03:17 UTC every third day
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read one problem id
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository secrets."
            exit 1
          fi
          curl -fsS --retry 3 --max-time 30 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/problems?select=id&limit=1" > /dev/null
          echo "Database is awake."
